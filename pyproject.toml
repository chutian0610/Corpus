[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-bot"
version = "0.2.0"
description = "LLM-driven wiki builder (CLI-first, skill-friendly, storage layer future-MCP-friendly)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "corpus-bot contributors"}]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
corpus = "corpus_bot.cli:main"

# Codex platform skill 入口通过项目级 .agents/skills/corpus-bot/SKILL.md 发现,
# 不在这里声明 (setuptools 校验 module 必须在 corpus_bot 包内, 会 build 失败).

[tool.setuptools.packages.find]
where = ["src"]
include = ["corpus_bot*"]

[tool.setuptools.package-data]
corpus_bot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
